
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spots Scripts</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #090811;
      color: #f5f2ff;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 18px;
      border: 1px solid #49336c;
      border-radius: 16px;
      background: #151225;
    }
    h1 { color: #c4b5fd; }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }
    .game {
      padding: 18px;
      border: 1px solid #49336c;
      border-radius: 14px;
      background: #151225;
    }
    .game h2 { font-size: 17px; }
    p { color: #b4a9ca; }
  </style>
</head>
<body>
  <header>
    <h1>✦ Spots Scripts</h1>
    <p>Your Roblox community script hub.</p>
  </header>

  <main class="games">
    <article class="game"><h2>🏴‍☠️ Blox Fruits</h2><p>Script resources and tools.</p></article>
    <article class="game"><h2>🕵️ MM2</h2><p>Community resources.</p></article>
    <article class="game"><h2>⚡ Blade Ball</h2><p>Development examples.</p></article>
    <article class="game"><h2>🌱 Grow a Garden</h2><p>Garden game resources.</p></article>
    <article class="game"><h2>🪴 Grow a Garden 2</h2><p>Development guides.</p></article>
    <article class="game"><h2>🧠 Steal a Brainrot</h2><p>Game development tools.</p></article>
  </main>
</body>
</html>
